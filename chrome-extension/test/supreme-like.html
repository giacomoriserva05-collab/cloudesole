<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scheda prodotto in stile Supreme — banco di prova</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 620px; margin: 24px auto; }
    select { padding: 6px; min-width: 110px; }
    .cta { padding: 10px 20px; margin-top: 14px; border: 1px solid #111; background: #fff; cursor: pointer; }
    .cta[disabled] { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <!-- Ricostruzione fedele di eu.supreme.com (Shopify + styled-components):
       nessun <form>, nessun link al carrello in pagina, classi senza senso,
       taglie scritte per esteso e valori che sono id di variante.
       Il pulsante buono si chiama name="remove". -->
  <h1>Hooded Varsity Jacket</h1>
  <p>€ 398</p>

  <select name="size" aria-label="size" data-testid="size-dropdown" class="sc-jUEnpp gICwoJ">
    <option value="42727418626252">Small</option>
    <option value="42727428653260">Medium</option>
    <option value="42727423246540">XLarge</option>
  </select>

  <div id="ctas"></div>

  <script>
    const q = new URLSearchParams(location.search);

    const btn = document.createElement('button');
    btn.type = 'submit';
    btn.className = 'sc-fFubgA iOAQBx cta';
    if (q.has('soldout')) {
      btn.name = 'sold out';
      btn.textContent = 'sold out';
      btn.disabled = true;
    } else {
      btn.name = 'remove';                 // sì, davvero: è così sul sito
      btn.textContent = 'add to cart';
      // Con ?locked il pulsante si sblocca solo dopo aver scelto la taglia.
      if (q.has('locked')) {
        btn.disabled = true;
        document.querySelector('select').addEventListener('change', () => { btn.disabled = false; });
      }
    }
    document.getElementById('ctas').appendChild(btn);

    window.__log = { clicked: null, size: null };
    btn.addEventListener('click', () => { window.__log.clicked = btn.textContent; });
    document.querySelector('select').addEventListener('change', (e) => {
      window.__log.size = e.target.selectedOptions[0].textContent;
    });

    const FAKE = {
      armed: true,
      settings: { autoFillCheckout: true, cartWait: 9000 },
      sites: {},
      activeId: 'p1',
      profiles: [{ id: 'p1', name: 'Casa', shipping: { size: q.get('size') || '' }, billing: {} }]
    };
    window.chrome = {
      storage: { local: { get: async () => FAKE } },
      runtime: { sendMessage: async () => ({ filled: 0 }) }
    };
  </script>
  <script src="../cartcore.js"></script>
  <script src="../autopilot.js"></script>
</body>
</html>
