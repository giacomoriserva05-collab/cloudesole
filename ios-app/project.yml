# Descrizione del progetto per XcodeGen.
#
#   brew install xcodegen
#   cd ios-app && xcodegen generate && open CheckoutAutofill.xcodeproj
#
# Il file .xcodeproj non sta nel repository apposta: si rigenera da qui, e non
# ci sono conflitti da risolvere a mano.

name: CheckoutAutofill

options:
  bundleIdPrefix: it.local
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  CheckoutAutofill:
    type: application
    platform: iOS
    sources:
      - path: CheckoutAutofill
        excludes:
          - "Resources/**"
      # I tre file JavaScript vanno nel bundle come risorse: sono il motore,
      # li legge WebController con Bundle.main.url(forResource:).
      - path: CheckoutAutofill/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giacomoriserva.checkoutautofill
        INFOPLIST_FILE: CheckoutAutofill/Info.plist
        # Un pezzo di Objective-C: la rete di sicurezza sui tocchi.
        # Swift non sa catturare le eccezioni di Objective-C, e quel
        # crollo e' esattamente un'eccezione.
        SWIFT_OBJC_BRIDGING_HEADER: CheckoutAutofill/CheckoutAutofill-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: CheckoutAutofill/CheckoutAutofill.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        # La versione mostrata all'utente e il numero di build. Quest'ultimo
        # lo sovrascrive la CI a ogni caricamento: TestFlight rifiuta due
        # build con lo stesso numero.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Senza icona TestFlight rifiuta la build: "Missing required icon
        # file". Dal 1024 singolo Xcode ricava da sé tutte le misure, iPad
        # compreso.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Il controllo che mancava: avviare l'app non basta, se poi crolla
  # aprendo una scheda. Questi test la toccano dove la tocca una persona.
  CheckoutAutofillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CheckoutAutofillUITests
    dependencies:
      - target: CheckoutAutofill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giacomoriserva.checkoutautofill.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: CheckoutAutofill

# Senza uno schema condiviso `xcodebuild -scheme` non trova niente, e la
# compilazione in cloud fallisce prima ancora di leggere una riga di Swift.
schemes:
  CheckoutAutofill:
    build:
      targets:
        CheckoutAutofill: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CheckoutAutofillUITests
    archive:
      config: Release
