name: Compila l'app iOS

# Su Windows non esiste modo di compilare per iOS: lo fa un runner macOS di
# GitHub, che ha Xcode già installato. Serve a sapere se il codice Swift sta
# in piedi, e a leggere gli errori quando non ci sta.

on:
  push:
    paths:
      - 'ios-app/**'
      - 'chrome-extension/cartcore.js'
      - 'chrome-extension/filler.js'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios-app/**'
  workflow_dispatch:        # avviabile a mano da gh o dal sito

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Il motore JavaScript è allineato all'estensione
        run: |
          python3 ios-app/tools/sync-js.py
          if ! git diff --quiet -- ios-app/CheckoutAutofill/Resources; then
            echo "::error::Le risorse JS non sono allineate con chrome-extension/."
            echo "Esegui 'python ios-app/tools/sync-js.py' e ricommetti."
            git diff --stat -- ios-app/CheckoutAutofill/Resources
            exit 1
          fi
          echo "Motore allineato."

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: ios-app
        run: xcodegen generate

      - name: Compila per il simulatore
        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild \
            -project CheckoutAutofill.xcodeproj \
            -scheme CheckoutAutofill \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      # Compilare non è funzionare: qui l'app viene davvero installata su un
      # iPhone simulato, avviata, e fotografata. È il primo momento in cui
      # qualcuno la vede in faccia.
      - name: Avvia nel simulatore e fotografa
        working-directory: ios-app
        run: |
          set -e
          mkdir -p schermate

          # Si prende il primo iPhone disponibile invece di fissare un nome:
          # l'elenco dei simulatori cambia a ogni versione di Xcode.
          UDID=$(xcrun simctl list devices available -j \
                 | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(v['udid'] for r in d.values() for v in r if 'iPhone' in v['name']))")
          NOME=$(xcrun simctl list devices | grep "$UDID" | sed 's/ (.*//' | xargs)
          echo "Simulatore: $NOME  ($UDID)"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          xcodebuild -project CheckoutAutofill.xcodeproj \
                     -scheme CheckoutAutofill \
                     -destination "id=$UDID" \
                     -configuration Debug \
                     -derivedDataPath dd \
                     CODE_SIGNING_ALLOWED=NO \
                     build > /dev/null

          APP=$(find dd/Build/Products -name "CheckoutAutofill.app" -maxdepth 3 | head -1)
          echo "Pacchetto: $APP"
          echo "--- risorse dentro il pacchetto ---"
          ls "$APP" | grep -E "\.js$" || echo "ATTENZIONE: nessun file JavaScript nel pacchetto"

          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.giacomoriserva.checkoutautofill

          sleep 6
          xcrun simctl io "$UDID" screenshot schermate/1-avvio.png
          sleep 12
          xcrun simctl io "$UDID" screenshot schermate/2-dopo-il-caricamento.png

          # Se è morta subito, il processo non c'è più.
          if xcrun simctl spawn "$UDID" launchctl list | grep -q checkoutautofill; then
            echo "L'app è viva."
          else
            echo "::warning::L'app non risulta in esecuzione: potrebbe essere crollata."
          fi

      # Avviare l'app non basta: un crollo si vede aprendo le schede.
      - name: Tocca le schede e verifica che non crolli
        working-directory: ios-app
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j                  | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(v['udid'] for r in d.values() for v in r if 'iPhone' in v['name']))")
          xcodebuild test             -project CheckoutAutofill.xcodeproj             -scheme CheckoutAutofill             -destination "id=$UDID"             -configuration Debug             CODE_SIGNING_ALLOWED=NO             2>&1 | tee test.log | grep -E "Test Case|error:|failed|passed|\*\* TEST" || true
          # Il tee non propaga l'esito: si guarda il verdetto nel registro.
          if grep -q "\*\* TEST FAILED \*\*" test.log; then
            echo "::error::I test d'interfaccia hanno trovato un crollo."
            grep -E "error:|XCTAssert|Crash|crashed" test.log | sort -u | head -30
            exit 1
          fi
          echo "Le schede si aprono senza crollare."

      - name: Conserva schermate e resoconti di crash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermate
          path: |
            ios-app/schermate/*.png
            ios-app/test.log
            ~/Library/Logs/DiagnosticReports/*
          if-no-files-found: warn
          retention-days: 7

      # Il log di xcodebuild è enorme: quando fallisce serve solo questo.
      - name: Gli errori, senza il contorno
        if: failure()
        working-directory: ios-app
        run: |
          echo "===== ERRORI ====="
          grep -E "error:" build.log | sort -u | head -80 || echo "(nessuna riga 'error:' nel log)"
          echo "===== AVVISI ====="
          grep -E "warning:" build.log | sort -u | head -30 || true

      - name: Conserva il log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios-app/build.log
          if-no-files-found: ignore
          retention-days: 7
