<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Anteprima del popup</title>
  <style>body { margin: 0; }</style>
</head>
<body>
  <script>
    // Captcha finti per il riquadro della scheda Sito. Dalla console:
    // `__captcha.metti('hcaptcha')`, `__captcha.metti('recaptcha','turnstile')`,
    // `__captcha.risolvi('hcaptcha')`, `__captcha.scadi('hcaptcha')`,
    // `__captcha.vuoto()`.
    const MODELLI = {
      recaptcha: { nome: 'reCAPTCHA', gestito: true, ttl: 120,
        versione: 'v2 — casella da spuntare', versioneId: 'v2', sfida: true,
        sitekey: '6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI',
        azione: 'widget azzerato — la spunta va rimessa a mano' },
      recaptchaV3: { id: 'recaptcha', nome: 'reCAPTCHA', gestito: true, ttl: 120,
        versione: 'v3 — punteggio', versioneId: 'v3', sfida: false,
        sitekey: '6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI',
        azione: 'token nuovo richiesto a Google' },
      hcaptcha: { nome: 'hCaptcha', gestito: true, ttl: 120,
        versione: 'casella da spuntare', versioneId: 'casella', sfida: true,
        sitekey: '10000000-ffff-ffff-ffff-000000000001',
        azione: 'widget azzerato — la spunta va rimessa a mano' },
      turnstile: { nome: 'Cloudflare Turnstile', gestito: true, ttl: 300,
        versione: 'gestito', versioneId: 'gestito', sfida: false,
        sitekey: '1x00000000000000000000AA',
        azione: 'widget azzerato — Turnstile riparte da solo' },
      arkose: { nome: 'Arkose Labs / FunCaptcha', gestito: false,
        versione: 'non gestito da qui' },
      casalingo: { nome: 'Captcha a immagine (fatto in casa)', gestito: false,
        versione: 'immagine e campo di testo' }
    };

    const finto = window.__captcha = {
      attivi: ['recaptcha'],
      stato: {},
      metti(...quali) { this.attivi = quali; this.stato = {}; },
      vuoto() { this.attivi = []; },
      st(id) {
        if (!this.stato[id]) this.stato[id] = { emesso: 0, scaduto: false, emissioni: 0, scadenze: 0, rinnovi: 0 };
        return this.stato[id];
      },
      risolvi(id) {
        const s = this.st(id || this.attivi[0]);
        s.emesso = Date.now(); s.scaduto = false; s.emissioni++;
      },
      scadi(id) {
        const s = this.st(id || this.attivi[0]);
        if (!s.emesso) return;
        s.emesso = 0; s.scaduto = true; s.scadenze++;
      },
      probe() {
        const fornitori = this.attivi.map((chiave) => {
          const m = MODELLI[chiave];
          const id = m.id || chiave;
          const base = { id, nome: m.nome, gestito: m.gestito, versione: m.versione,
                         widget: 1, montato: true, sitekey: m.sitekey || '' };
          if (!m.gestito) return base;
          const s = this.st(id);
          const restano = s.emesso
            ? Math.max(0, m.ttl - Math.round((Date.now() - s.emesso) / 1000)) : 0;
          if (s.emesso && !restano) this.scadi(id);
          const valido = !!s.emesso && !s.scaduto;
          return Object.assign(base, {
            versioneId: m.versioneId, sfida: m.sfida, ttl: m.ttl, apiPronta: true,
            token: valido ? '03AFinto1234ab…' : '', tokenLungo: valido ? 248 : 0,
            valido, scaduto: s.scaduto, restano,
            emissioni: s.emissioni, scadenze: s.scadenze, rinnovi: s.rinnovi,
            campo: 'textarea'
          });
        });
        return { presente: fornitori.length > 0, fornitori };
      },
      rinnova(id) {
        const chiave = this.attivi.find((k) => (MODELLI[k].id || k) === id);
        if (!chiave) return { ok: false, motivo: 'fornitore sconosciuto: ' + id };
        const m = MODELLI[chiave];
        if (!m.gestito) return { ok: false, motivo: m.nome + " ha un'API chiusa: va rifatto a mano" };
        const s = this.st(id);
        s.rinnovi++;
        if (m.sfida) { s.emesso = 0; s.scaduto = false; }
        else { s.emesso = Date.now(); s.scaduto = false; s.emissioni++; }
        return { ok: true, id, nome: m.nome, modo: m.versioneId, azione: m.azione, sfida: m.sfida };
      }
    };

    // API di Chrome finte: servono solo a far girare il popup fuori dall'estensione.
    const mem = { local: {}, session: {} };
    const area = (bag) => ({
      get: async (keys) => {
        const list = Array.isArray(keys) ? keys : [keys];
        const out = {};
        for (const k of list) if (k in bag) out[k] = bag[k];
        return out;
      },
      set: async (obj) => Object.assign(bag, obj),
      remove: async (k) => { delete bag[k]; }
    });
    window.chrome = {
      storage: { local: area(mem.local), session: area(mem.session) },
      tabs: { query: async () => [{ id: 1, url: 'https://www.esempio-store.it/checkout' }] },
      scripting: {
        // Il vero executeScript inietta nella pagina; qui si smista in base a
        // cosa il popup ha chiesto, così anche la sezione captcha è provabile.
        executeScript: async (opts) => {
          if (opts.files) return [{ result: null }];
          const src = String(opts.func || '');
          if (/CaptchaCore\.probe/.test(src)) return [{ result: finto.probe() }];
          if (/CaptchaCore\.rinnova/.test(src)) return [{ result: finto.rinnova(...(opts.args || [])) }];
          return [{ result: { scanned: 0, filled: [] } }];
        }
      },
      // window.__grant decide se la richiesta di permesso viene accettata.
      permissions: {
        contains: async () => window.__granted === true,
        request: async () => { window.__granted = window.__grant !== false; return window.__granted; }
      },
      action: { setBadgeText: async () => {}, setBadgeBackgroundColor: async () => {} },
      // Finge il service worker: risponde a STATUS e SYNC come farebbe lui.
      runtime: {
        sendMessage: async (m) => {
          if (!m || (m.type !== 'STATUS' && m.type !== 'SYNC')) return null;
          const armed = !!mem.local.armed;
          const granted = window.__granted === true;
          return { armed, granted, registered: armed && granted, files: ['cartcore.js', 'autopilot.js'] };
        }
      },
      commands: { onCommand: { addListener: () => {} } }
    };
  </script>
  <script type="module">
    const html = await (await fetch('../popup.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = '../popup.css';
    document.head.appendChild(css);
    document.body.innerHTML = doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g, '');
    await import('../popup.js');
  </script>
</body>
</html>
